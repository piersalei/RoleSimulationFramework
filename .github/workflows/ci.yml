name: engineering-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m rolesim validate role1
      - run: python -m rolesim validate role2
      - run: python -m rolesim validate role3
      - run: python -m rolesim skills role1
      - run: python -m rolesim list
      - run: python -m rolesim run --out runs/ci-smoke
      - run: python -m rolesim audit runs/ci-smoke
      - run: python -m rolesim run --roles role2 role1 --scene test2 --out runs/ci-swapped
      - run: python -m rolesim audit runs/ci-swapped
      - run: python -m rolesim run --no-skills --out runs/ci-no-skills
      - run: python -m rolesim audit runs/ci-no-skills
      - run: python -m rolesim run --roles role1 role2 role3 --scene test3 --out runs/ci-three-roles
      - run: python -m rolesim audit runs/ci-three-roles
